[package]
name = "voxel-maker"
version = "0.1.0"
description = "AI-native generic voxel editor - desktop shell"
authors = ["Voxel Maker contributors"]
edition = "2021"
# Private application crate: never published to crates.io (the license
# gate in deny.toml relies on this to exempt the crate itself).
publish = false

# The library is linked by the mobile entrypoint when present; the desktop
# binary uses the cdylib/rlib pair.
[lib]
name = "voxel_maker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
keyring = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Opaque handle tokens for the scoped native-handle registry (issue #94).
# UUID v4 is unguessable, so a webview can never enumerate or forge a
# handle for a path it was not issued.
uuid = { version = "1", features = ["v4"] }

# The tauri unit-test helpers (mock app/state) are enabled only for the
# test build; the release binary never compiles them.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }
