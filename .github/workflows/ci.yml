name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:security
      - run: pnpm check:audit
      # Ticket #45: CI smoke thresholds detect gross scale/performance
      # regressions on every PR (broad thresholds; the named reference
      # and low tiers are qualified on their own hardware).
      - env:
          NODE_OPTIONS: --expose-gc
        run: pnpm bench:smoke
