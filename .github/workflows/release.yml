name: Release qualification and packaging

on:
  schedule:
    # Nightly qualification on all three supported OSes (plan S17.8).
    - cron: "41 3 * * *"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact-suffix: macos
          - os: windows-latest
            artifact-suffix: windows
          - os: ubuntu-22.04
            artifact-suffix: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: pnpm
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install Cargo security tooling
        # Issue #74: cargo-audit (vulnerabilities), cargo-deny (license
        # allowlist), and cargo-cyclonedx (SBOM) back the Cargo-side
        # gates; the SBOM ships inside the release artifact set.
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny,cargo-cyclonedx
      - name: Install Linux bundling dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - run: pnpm install --frozen-lockfile
      - name: Full check suite (headless qualification)
        # The whole gate chain incl. the release smoke and genericity
        # gate runs on every OS (the engine is platform-independent).
        run: pnpm check
      - name: Security and audit gates
        # Issue #74: the Cargo vulnerability and license gates run
        # alongside the npm-side gates on every qualified platform.
        run: |
          pnpm check:security
          pnpm check:audit
          pnpm check:rust:audit
          pnpm check:rust:licenses
      - name: Build release artifacts for this platform
        # tauri build produces the platform installers; the packaging
        # script collects them, adds the headless CLIs, and writes
        # SHASUMS256.txt + manifest.json. macOS signing/notarization is
        # applied when the secrets are configured (approved-exception
        # pattern: unconfigured runs produce unsigned artifacts and
        # record the fact in the manifest).
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.APPLE_NOTARY_KEYCHAIN_PROFILE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm release:package
      - name: Verify artifact checksums
        run: pnpm release:verify-checksums
      - name: Assert native installer present
        # Issue #70: a release set without a platform installer must
        # never be uploaded or published. release:package already exits
        # non-zero on bundle failure; this step re-checks the manifest
        # (bundle.ok plus the expected installer kinds recorded by the
        # script) so a future --allow-no-bundle misuse cannot slip
        # through.
        run: |
          manifest=$(find release/artifacts -name manifest.json | head -n 1)
          test -n "$manifest" || { echo "no release manifest found"; exit 1; }
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (manifest.bundle.ok !== true) {
              console.error("bundle.ok is not true; refusing to upload");
              process.exit(1);
            }
            const expected = manifest.bundle.expectedInstallers ?? [];
            const present = manifest.bundle.installerKinds ?? [];
            if (!expected.some((kind) => present.includes(kind))) {
              console.error("no expected installer kind present; refusing to upload");
              process.exit(1);
            }
            console.log("native installer asserted:", (manifest.bundle.artifacts ?? []).join(", "));
          ' "$manifest"
      - name: Assert SBOM evidence present
        # Issue #74: release evidence must include the Cargo SBOM.
        # release:package already fails when the SBOM cannot be
        # generated; this step re-checks the manifest and the artifact
        # set so a future --allow-no-bundle misuse cannot slip through.
        run: |
          manifest=$(find release/artifacts -name manifest.json | head -n 1)
          test -n "$manifest" || { echo "no release manifest found"; exit 1; }
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (manifest.sbom?.ok !== true) {
              console.error("sbom.ok is not true; refusing to upload");
              process.exit(1);
            }
            const file = manifest.sbom.file;
            if (!file || !fs.existsSync(path.join(path.dirname(process.argv[1]), file))) {
              console.error("sbom file missing from artifact set; refusing to upload");
              process.exit(1);
            }
            console.log("SBOM evidence asserted:", file);
          ' "$manifest"
      - name: Upload artifact set
        uses: actions/upload-artifact@v4
        with:
          name: voxel-maker-${{ matrix.artifact-suffix }}-${{ github.sha }}
          path: release/artifacts/**
          if-no-files-found: error

  publish:
    # On tag push only: gather every platform artifact set into one
    # GitHub release. GitHub release assets share one flat name namespace,
    # so identically named files across platform sets (manifest.json,
    # SHASUMS256.txt, the headless probes) would collide and the upload
    # would fail partway. release-publish.mjs renames every file inside
    # each set to <platform>-<arch>-<basename>, regenerates the set's
    # checksums and manifest so they name the published files, and prints
    # the flat file list to attach.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fail the step (not just the script) when preparation fails, so
          # a broken prepare can never publish an empty release.
          node scripts/release-publish.mjs artifacts > .release-files.txt || {
            echo "release-publish failed; aborting release" >&2
            exit 1
          }
          files=()
          while IFS= read -r file; do
            files+=("$file")
          done < .release-files.txt
          echo "attaching ${#files[@]} files:"
          printf '%s\n' "${files[@]}"
          gh release create "${{ github.ref_name }}" "${files[@]}" \
            --repo "${{ github.repository }}" \
            --title "Voxel Maker ${{ github.ref_name }}" \
            --notes "See RELEASE.md and docs/release/ in the repository for the support matrix, known limitations, format compatibility, backup guidance, privacy disclosure, and gate evidence."
